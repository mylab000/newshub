  [data-theme="grafit"].dark{

    --accent:#9333c9; --accent-soft:#ecdcf7; --accent-text:#ffffff;
    --danger:#c0453d; --danger-soft:#fceae8; --ok:#3f8f5c;
  }
  [data-theme="neon"].dark{

    --ink:#ece2f5; --muted:#a389bd;
    --accent:#c565f0; --accent-soft:#2c1a3a; --accent-text:#0f0714;

  [data-theme="hutan"]{
    --bg:#f2f6ef; --panel:#ffffff; --panel-alt:#e3eedc; --line:#cbe0c0;
    --ink:#16240f; --muted:#5d7852;
    --accent:#4f8c2a; --accent-soft:#deefd2; --accent-text:#ffffff;
    --danger:#c0453d; --danger-soft:#fceae8; --ok:#4f8c2a;
  }
  [data-theme="hutan"].dark{
    --bg:#0a0f0a; --panel:#111a10; --panel-alt:#172216; --line:#263524;
    --ink:#e2ecdf; --muted:#84a179;
    --accent:#7ec850; --accent-soft:#1c2f16; --accent-text:#0a1206;
  }
  body[data-font="inter"]{ --sans:'Inter', -apple-system, 'Segoe UI', sans-serif; }
  body[data-font="manrope"]{ --sans:'Manrope', -apple-system, 'Segoe UI', sans-serif; }
  body[data-font="sora"]{ --sans:'Sora', -apple-system, 'Segoe UI', sans-serif; }
  body[data-font="source-serif"]{ --sans:'Source Serif 4', Georgia, 'Times New Roman', serif; }
  body[data-font="system"]{ --sans:-apple-system, 'Segoe UI', Roboto, sans-serif; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column;
    position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(620px circle at 6% -6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 62%),
      radial-gradient(520px circle at 106% 16%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      radial-gradient(560px circle at 46% 118%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 62%);
  }
  header, main, footer{ position:relative; z-index:1; }

  header{
    background:color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; flex-shrink:0;
  }
  .brand-name{ font-weight:650; font-size:1.05rem; letter-spacing:-0.01em; }
  .brand-tag{ font-size:0.68rem; color:var(--muted); font-family:var(--mono); letter-spacing:0.03em; }
  .header-actions{ display:flex; gap:8px; align-items:center; }

  .icon-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--panel-alt); color:var(--ink); }
  .icon-btn.spinning svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .sync-badge{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sync-badge.local{ background:#9ca3af; }
  .sync-badge.syncing{ background:var(--accent); animation:pulse-sync 1s infinite; }
  .sync-badge.synced{ background:var(--ok); }
  .sync-badge.error{ background:var(--danger); }
  @keyframes pulse-sync{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .settings-dropdown-wrap{ position:relative; }
  .settings-dropdown-panel{
    position:absolute; top:calc(100% + 8px); right:0; z-index:200;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; width:270px;
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .settings-section{ margin-bottom:16px; }
  .settings-section:last-child{ margin-bottom:0; }
  .settings-label{
    font-size:0.68rem; color:var(--muted); text-transform:uppercase; font-weight:700;
    letter-spacing:0.05em; margin-bottom:9px; font-family:var(--mono);
  }
  .mode-toggle-row{ display:flex; gap:6px; }
  .mode-toggle-btn{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
    color:var(--muted); cursor:pointer; font-family:var(--sans); font-size:0.78rem; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .mode-toggle-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .theme-swatch-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .theme-swatch{
    width:100%; aspect-ratio:1; border-radius:50%; border:2.5px solid transparent;
    cursor:pointer; padding:0; position:relative;
  }
  .theme-swatch.active{ border-color:var(--ink); }
  .theme-swatch.active::after{
    content:''; position:absolute; inset:-5px; border-radius:50%; border:1.5px solid var(--ink);
  }

  .font-option-list{ display:flex; flex-direction:column; gap:6px; }
  .font-option-btn{
    text-align:left; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); cursor:pointer; font-size:0.88rem;
  }
  .font-option-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  .auth-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
  .auth-card{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  .auth-title{ font-weight:650; font-size:1.3rem; text-align:center; margin-bottom:4px; }
  .auth-sub{ font-size:0.8rem; color:var(--muted); text-align:center; margin-bottom:22px; }
  .auth-field{ margin-bottom:13px; }
  .auth-field label{ display:block; font-size:0.72rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600; }
  .auth-field input{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); font-size:0.9rem; font-family:var(--sans); background:var(--bg); color:var(--ink); box-sizing:border-box; }
  .auth-field input:focus{ outline:none; border-color:var(--accent); }
  .auth-btn{ width:100%; padding:11px; border-radius:9px; border:none; background:var(--accent); color:#fff; font-weight:600; font-size:0.87rem; cursor:pointer; margin-top:4px; }
  .auth-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .auth-switch{ text-align:center; font-size:0.78rem; margin-top:14px; color:var(--muted); }
  .auth-switch button{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; font-size:0.78rem; }
  .auth-error{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:9px 11px; font-size:0.76rem; margin-bottom:12px; }
  .auth-note{ background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px 11px; font-size:0.72rem; margin-bottom:14px; line-height:1.5; }
  .auth-skip{ text-align:center; margin-top:10px; }
  .auth-skip button{ background:none; border:none; color:var(--muted); font-size:0.74rem; text-decoration:underline; cursor:pointer; }

  main{
    flex:1; max-width:880px; margin:0 auto; padding:20px 16px 60px; width:100%;
  }

  .keyword-bar{
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:18px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 10px 24px -16px rgba(0,0,0,0.14);
  }
  .keyword-input-row{ display:flex; gap:8px; margin-bottom:12px; }
  .keyword-input-row input{
    flex:1; padding:10px 13px; border-radius:9px; border:1px solid var(--line);
    font-size:0.9rem; font-family:var(--sans); background:var(--bg); color:var(--ink);
  }
  .keyword-input-row input:focus{ outline:none; border-color:var(--accent); }
  .btn-add{
    padding:10px 18px; border-radius:9px; border:none; background:var(--accent); color:#fff;
    font-weight:600; font-size:0.85rem; cursor:pointer; white-space:nowrap;
  }
  .btn-add:hover{ filter:brightness(1.08); }

  .keyword-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .keyword-chip{
    display:flex; align-items:center; gap:7px; padding:7px 8px 7px 14px; border-radius:20px;
    background:var(--accent-soft); color:var(--accent); font-size:0.83rem; font-weight:500;
  }
  .keyword-chip button{
    width:18px; height:18px; border-radius:50%; border:none; background:rgba(47,111,237,0.15);
    color:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; padding:0; flex-shrink:0;
  }
  .keyword-chip button:hover{ background:rgba(47,111,237,0.3); }
  .keyword-empty{ font-size:0.85rem; color:var(--muted); padding:6px 2px; }

  .status-row{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
    font-size:0.78rem; color:var(--muted); flex-wrap:wrap; gap:8px;
  }
  .status-row .count{ color:var(--accent); font-weight:650; }

  .timeline{ display:flex; flex-direction:column; gap:12px; }
  .feed-card{
    display:flex; gap:12px; align-items:flex-start;
    background:color-mix(in srgb, var(--panel) 86%, transparent);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 16px 14px; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,0.05), 0 10px 24px -14px rgba(0,0,0,0.16);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    opacity:0; transform:translateY(10px); animation:feedCardIn .38s ease forwards;
    position:relative; overflow:hidden;
  }
  .feed-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); transform:scaleY(0); transform-origin:top;
    transition:transform .18s ease;
  }
  .feed-card:hover{
    transform:translateY(-3px);
    box-shadow:0 2px 6px rgba(0,0,0,0.07), 0 18px 34px -14px rgba(0,0,0,0.22);
    border-color:var(--accent);
  }
  .feed-card:hover::before{ transform:scaleY(1); }
  @keyframes feedCardIn{ to{ opacity:1; transform:translateY(0); } }
  .timeline .feed-card:nth-child(1){ animation-delay:.02s; }
  .timeline .feed-card:nth-child(2){ animation-delay:.06s; }
  .timeline .feed-card:nth-child(3){ animation-delay:.10s; }
  .timeline .feed-card:nth-child(4){ animation-delay:.14s; }
  .timeline .feed-card:nth-child(5){ animation-delay:.18s; }
  .timeline .feed-card:nth-child(6){ animation-delay:.22s; }
  .timeline .feed-card:nth-child(n+7){ animation-delay:.24s; }
  @media (prefers-reduced-motion:reduce){
    .feed-card{ animation:none; opacity:1; transform:none; }
    .feed-card:hover{ transform:none; }
  }

  .feed-avatar{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent);
    font-weight:650; font-size:1rem; font-family:var(--mono);
  }
  .feed-card-body{ flex:1; min-width:0; }
  .feed-card-top{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;
  }
  .feed-source-name{ font-weight:600; font-size:0.85rem; color:var(--ink); }
  .feed-dot{ color:var(--muted); font-size:0.8rem; }
  .feed-keyword-tag{
    background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:0.68rem;
    padding:3px 9px; border-radius:20px; flex-shrink:0; margin-left:auto;
  }
  .feed-time{ font-size:0.8rem; color:var(--muted); flex-shrink:0; }
  .feed-title{ font-weight:600; font-size:1.02rem; line-height:1.42; color:var(--ink); margin-bottom:2px; }
  .feed-source{ font-size:0.78rem; color:var(--muted); font-weight:600; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted);
  }
  .empty-state .icon{ font-size:2.2rem; margin-bottom:12px; opacity:0.5; }
  .empty-state .title{ font-weight:600; color:var(--ink); margin-bottom:6px; }
  .empty-state .sub{ font-size:0.85rem; line-height:1.6; }

  .error-banner{
    background:var(--danger-soft); color:var(--danger); border-radius:10px; padding:10px 14px;
    font-size:0.8rem; margin-bottom:14px; line-height:1.5;
  }
  .stale-banner{
    background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px 14px;
    font-size:0.8rem; margin-bottom:14px; line-height:1.5; display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .stale-banner button{
    background:none; border:1px solid currentColor; color:inherit; border-radius:7px;
    padding:5px 10px; font-size:0.75rem; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .loading-inline{
    display:flex; align-items:center; gap:10px; padding:16px; color:var(--muted); font-size:0.85rem;
  }
  .spinner-sm{
    width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0;
  }

  footer{ text-align:center; padding:18px; font-family:var(--mono); font-size:0.65rem; color:var(--muted); }

  @media (max-width:600px){
    .keyword-input-row{ flex-direction:column; }
    .btn-add{ width:100%; }
  }
</style>

<div id="mainPage" style="display:none;">

      <div class="brand-name">NewsDotCom</div>

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="logoutBtn" onclick="handleLogout()" title="Log keluar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="keyword-bar">
    <div class="keyword-input-row">
      <input type="text" id="keywordInput" placeholder="Taip kata kunci, contoh: Harimau Malaya, banjir Selangor..." onkeydown="if(event.key==='Enter')addKeyword()">
      <button class="btn-add" onclick="addKeyword()">＋ Tambah</button>
    </div>
    <div class="keyword-chips" id="keywordChips"></div>
  </div>

  <div class="status-row" id="statusRow" style="display:none;">
    <span><span class="count" id="articleCount">0</span> berita dijumpai</span>
    <span id="lastUpdated"></span>
  </div>

  <div id="resultsRoot"></div>
</main>

<footer>NewsDotCom &middot; Cari berita merentas portal guna Google News, terus dalam pelayar.</footer>
</div>

<script>
  const $ = id => document.getElementById(id);

  let keywords = [];
  let resultsByKeyword = {}; // { keyword: { loading, error, articles: [] } }
  let currentUser = null;
  let syncStatus = 'local'; // 'local' | 'synced' | 'syncing' | 'error'

  // ---------- theme (8 colours + light/dark) ----------
  const COLOR_THEMES = [
    { key: 'amber', label: 'Amber' }, { key: 'karbon', label: 'Karbon' },
    { key: 'sianida', label: 'Sianida' }, { key: 'krimson', label: 'Krimson' },
    { key: 'oksida', label: 'Oksida' }, { key: 'grafit', label: 'Grafit' },
    { key: 'neon', label: 'Neon' }, { key: 'hutan', label: 'Hutan' }
  ];
  let currentColorTheme = 'amber';
  let currentDarkMode = false;
  let settingsDropdownOpen = false;

  // ---------- fon (boleh tukar, disimpan pada peranti sahaja) ----------
  const FONT_OPTIONS = [
    { key: 'inter', label: 'Inter', family: "'Inter', -apple-system, 'Segoe UI', sans-serif" },
    { key: 'manrope', label: 'Manrope', family: "'Manrope', -apple-system, 'Segoe UI', sans-serif" },
    { key: 'sora', label: 'Sora', family: "'Sora', -apple-system, 'Segoe UI', sans-serif" },
    { key: 'source-serif', label: 'Source Serif (editorial)', family: "'Source Serif 4', Georgia, serif" },
    { key: 'system', label: 'Fon sistem peranti', family: "-apple-system, 'Segoe UI', Roboto, sans-serif" }
  ];
  let currentFont = 'inter';

  function applyFontToDOM() {
    document.body.setAttribute('data-font', currentFont);
  }
  function persistFontLocal() {
    try { localStorage.setItem('newsDotComFont', currentFont); } catch (e) {}
  }
  function setFont(key) {
    currentFont = key;
    applyFontToDOM();
    persistFontLocal();
    persistThemeCloud();
    renderSettingsDropdown();
  }
  function initFontLocal() {
    try {
      currentFont = localStorage.getItem('newsDotComFont') || 'inter';
    } catch (e) {}
    applyFontToDOM();
  }
  initFontLocal();

  function applyThemeToDOM() {
    document.body.setAttribute('data-theme', currentColorTheme);
    document.body.classList.toggle('dark', currentDarkMode);
  }
  function persistThemeLocal() {
    try {
      localStorage.setItem('newsDotComColorTheme', currentColorTheme);
      localStorage.setItem('newsDotComDarkMode', currentDarkMode ? '1' : '0');
    } catch (e) {}
  }
  async function persistThemeCloud() {
    if (!currentUser || !supabaseClient) return;
    try {
      await supabaseClient.from('newsdotcom_settings').upsert({
        user_id: currentUser.id, color_theme: currentColorTheme, dark_mode: currentDarkMode,
        font_choice: currentFont, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    } catch (e) { console.error('Gagal simpan tema ke cloud', e); }
  }
  function setColorTheme(key) {
    currentColorTheme = key;
    applyThemeToDOM();
    persistThemeLocal();
    persistThemeCloud();
    renderSettingsDropdown();
  }
  function setDarkMode(isDark) {
    currentDarkMode = isDark;
    applyThemeToDOM();
    persistThemeLocal();
    persistThemeCloud();
    renderSettingsDropdown();
  }
  function toggleSettingsDropdown(e) {
    if (e) e.stopPropagation();
    settingsDropdownOpen = !settingsDropdownOpen;
    renderSettingsDropdown();
  }
  function renderSettingsDropdown() {
    const wrap = $('settingsDropdownWrap');
    if (!wrap) return;
    const existing = wrap.querySelector('.settings-dropdown-panel');
    if (existing) existing.remove();
    if (!settingsDropdownOpen) return;

    const panel = document.createElement('div');
    panel.className = 'settings-dropdown-panel';
    panel.onclick = ev => ev.stopPropagation();

    let html = '<div class="settings-section">';
    html += '  <div class="settings-label">Mod Paparan</div>';
    html += '  <div class="mode-toggle-row">';
    html += '    <button class="mode-toggle-btn' + (!currentDarkMode ? ' active' : '') + '" onclick="setDarkMode(false)">☀ Terang</button>';
    html += '    <button class="mode-toggle-btn' + (currentDarkMode ? ' active' : '') + '" onclick="setDarkMode(true)">🌙 Gelap</button>';
    html += '  </div>';
    html += '</div>';
    html += '<div class="settings-section">';
    html += '  <div class="settings-label">Warna Tema</div>';
    html += '  <div class="theme-swatch-grid">';
    COLOR_THEMES.forEach(t => {
      const active = currentColorTheme === t.key;
      html += '<button type="button" class="theme-swatch' + (active ? ' active' : '') + '" data-theme-key="' + t.key + '" title="' + t.label + '" onclick="setColorTheme(\'' + t.key + '\')"></button>';
    });
    html += '  </div>';
    html += '</div>';
    html += '<div class="settings-section">';
    html += '  <div class="settings-label">Fon</div>';
    html += '  <div class="font-option-list">';
    FONT_OPTIONS.forEach(f => {
      const active = currentFont === f.key;
      html += '<button type="button" class="font-option-btn' + (active ? ' active' : '') + '" style="font-family:' + f.family + '" onclick="setFont(\'' + f.key + '\')">' + escapeHtmlLocal(f.label) + '</button>';
    });
    html += '  </div>';
    html += '</div>';

    panel.innerHTML = html;
    wrap.appendChild(panel);

    panel.querySelectorAll('.theme-swatch').forEach(sw => {
      const key = sw.getAttribute('data-theme-key');
      const probe = document.createElement('div');
      probe.setAttribute('data-theme', key);
      probe.style.display = 'none';
      document.body.appendChild(probe);
      const accentColor = getComputedStyle(probe).getPropertyValue('--accent').trim();
      sw.style.background = accentColor || '#888';
      document.body.removeChild(probe);
    });
  }
  document.addEventListener('click', e => {
    if (settingsDropdownOpen && !e.target.closest('.settings-dropdown-wrap')) {
      settingsDropdownOpen = false;
      renderSettingsDropdown();
    }
  });
  function initThemeLocal() {
    try {
      currentColorTheme = localStorage.getItem('newsDotComColorTheme') || 'amber';
      currentDarkMode = localStorage.getItem('newsDotComDarkMode') === '1';
    } catch (e) {}
    applyThemeToDOM();
  }
  initThemeLocal();

  // ---------- persistence ----------
  function loadKeywordsLocal() {
    try {
      const raw = localStorage.getItem('imbasBeritaKeywords');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveKeywordsLocal() {
    try { localStorage.setItem('imbasBeritaKeywords', JSON.stringify(keywords)); } catch (e) {}
  }

  async function saveKeywords() {
    saveKeywordsLocal(); // always keep a local copy, works offline
    if (!currentUser || !supabaseClient) return;
    syncStatus = 'syncing';
    renderSyncBadge();
    try {
      await supabaseClient.from('imbas_berita_keywords').upsert({
        user_id: currentUser.id, keywords: keywords, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      syncStatus = 'synced';
    } catch (e) {
      console.error('Gagal segerak kata kunci', e);
      syncStatus = 'error';
    }
    renderSyncBadge();
  }

  async function loadKeywords() {
    if (currentUser && supabaseClient) {
      syncStatus = 'syncing';
      renderSyncBadge();
      try {
        const { data, error } = await supabaseClient
          .from('imbas_berita_keywords').select('keywords').eq('user_id', currentUser.id).maybeSingle();
        if (!error && data && Array.isArray(data.keywords)) {
          keywords = data.keywords;
          syncStatus = 'synced';
        } else {
          // No cloud record yet — fall back to any local keywords and push them up once.
          keywords = loadKeywordsLocal();
          if (keywords.length > 0) await saveKeywords();
          syncStatus = 'synced';
        }
      } catch (e) {
        console.error('Gagal muat kata kunci dari cloud', e);
        keywords = loadKeywordsLocal();
        syncStatus = 'error';
      }
    } else {
      keywords = loadKeywordsLocal();
      syncStatus = 'local';
    }
    renderSyncBadge();
  }

  function renderSyncBadge() {
    const el = $('syncBadge');
    if (!el) return;
    el.className = 'sync-badge ' + syncStatus;
    const labels = { local: 'Peranti ini sahaja', syncing: 'Menyegerak\u2026', synced: 'Disegerak ke cloud', error: 'Ralat segerak' };
    el.title = labels[syncStatus] || '';
  }

  // ---------- keyword management ----------
  function addKeyword() {
    const input = $('keywordInput');
    const value = input.value.trim();
    if (!value) return;
    if (keywords.some(k => k.toLowerCase() === value.toLowerCase())) {
      input.value = '';
      return;
    }
    keywords.push(value);
    saveKeywords();
    input.value = '';
    renderKeywordChips();
    fetchNewsFor(value);
  }

  function removeKeyword(kw) {
    keywords = keywords.filter(k => k !== kw);
    delete resultsByKeyword[kw];
    saveKeywords();
    renderKeywordChips();
    renderResults();
  }

  function renderKeywordChips() {
    const el = $('keywordChips');
    if (keywords.length === 0) {
      el.innerHTML = '<span class="keyword-empty">Belum ada kata kunci. Tambah satu untuk mula.</span>';
      return;
    }
    el.innerHTML = keywords.map(kw => `
      <span class="keyword-chip">
        ${escapeHtml(kw)}
        <button onclick="removeKeyword('${escapeJs(kw)}')" title="Buang">✕</button>
      </span>
    `).join('');
  }

  // ---------- fetching via Google News RSS ----------
  // Tier 1: Supabase Edge Function (server-side fetch, tiada isu CORS, tiada bergantung
  //          pada proksi awam pihak ketiga). Perlu deploy fungsi "newsdotcom-rss-proxy".
  // Tier 2: rantaian proksi CORS awam sebagai fallback sahaja, bila Edge Function belum
  //          dideploy atau sementara down.
  const EDGE_FUNCTION_URL = SUPABASE_URL.startsWith('http')
    ? SUPABASE_URL + '/functions/v1/newsdotcom-rss-proxy'
    : null;

  // Susunan proksi disusun ikut kestabilan diketahui: codetabs & allorigins terima
  // sebarang origin; corsproxy.io tier percuma hanya benarkan origin tertentu
  // (github.io termasuk, tapi domain custom tidak) — letak paling akhir.
  const CORS_PROXIES = [
    url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
    url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    url => 'https://corsproxy.io/?url=' + encodeURIComponent(url)
  ];

  function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, Object.assign({}, options, { signal: controller.signal }))
      .finally(() => clearTimeout(timeoutId));
  }

  async function fetchViaEdgeFunction(keyword, timeoutMs) {
    if (!EDGE_FUNCTION_URL) throw new Error('Edge Function tidak dikonfigurasi.');
    const res = await fetchWithTimeout(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ keyword })
    }, timeoutMs);
    if (!res.ok) throw new Error('Edge Function pulangkan status ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.articles)) throw new Error('Edge Function pulangkan format tidak dijangka.');
    return data.articles; // [{ title, link, pubDate, source }, ...]
  }

  async function fetchWithProxyFallback(targetUrl, timeoutMs) {
    let lastErr = null;
    // Setiap proksi dicuba sekali, dan seluruh rantaian diulang sekali lagi (backoff ringkas)
    // sekiranya percubaan pertama gagal disebabkan kesesakan sementara.
    for (let attempt = 0; attempt < 2; attempt++) {
      if (attempt === 1) await new Promise(r => setTimeout(r, 800));
      for (const buildProxyUrl of CORS_PROXIES) {
        const proxyUrl = buildProxyUrl(targetUrl);
        try {
          const res = await fetchWithTimeout(proxyUrl, {}, timeoutMs);
          if (res.ok) {
            const text = await res.text();
            if (text && text.trim()) return text;
          }
        } catch (err) {
          lastErr = err;
          // cuba proksi seterusnya
        }
      }
    }
    throw new Error('Semua proksi CORS gagal. Sila cuba lagi sebentar.');
  }

  async function fetchGoogleNewsRss(keyword, timeoutMs) {
    // Cuba Edge Function dulu (NewsData.io + cache) — pulangkan array artikel terus.
    try {
      return await fetchViaEdgeFunction(keyword, timeoutMs);
    } catch (edgeErr) {
      // Edge Function belum dideploy / gagal — fallback ke proksi awam + scrape Google News RSS.
      // Laluan ni pulangkan XML mentah, jadi kena parse ke array di sini supaya konsisten
      // dengan laluan Edge Function di atas.
      const rssUrl = buildGoogleNewsRssUrl(keyword);
      const xmlText = await fetchWithProxyFallback(rssUrl, timeoutMs);
      return parseRssXml(xmlText);
    }
  }

  function buildGoogleNewsRssUrl(keyword) {
    const q = encodeURIComponent(keyword);
    return `https://news.google.com/rss/search?q=${q}&hl=ms&gl=MY&ceid=MY:ms`;
  }

  function parseRssXml(xmlText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'text/xml');
    const parserError = doc.querySelector('parsererror');
    if (parserError) throw new Error('Gagal baca format berita (XML tidak sah).');

    const items = Array.from(doc.querySelectorAll('item'));
    return items.map(item => {
      const title = item.querySelector('title')?.textContent || '';
      const link = item.querySelector('link')?.textContent || '';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const sourceEl = item.querySelector('source');
      const source = sourceEl ? sourceEl.textContent : '';
      return { title, link, pubDate, source };
    });
  }

  async function fetchNewsFor(keyword) {
    resultsByKeyword[keyword] = { loading: true, error: null, articles: resultsByKeyword[keyword]?.articles || [] };
    renderResults();
    try {
      const articles = await fetchGoogleNewsRss(keyword, 15000);
      resultsByKeyword[keyword] = { loading: false, error: null, articles };
    } catch (err) {
      resultsByKeyword[keyword] = {
        loading: false,
        error: err.message || 'Gagal muat berita untuk kata kunci ini.',
        articles: resultsByKeyword[keyword]?.articles || []
      };
    }
    renderResults();
    updateStatusRow();
  }

  async function refreshAll() {
    if (keywords.length === 0) return;
    const btn = $('refreshBtn');
    btn.classList.add('spinning');
    await Promise.all(keywords.map(kw => fetchNewsFor(kw)));
    btn.classList.remove('spinning');
    $('lastUpdated').textContent = 'Dikemas kini ' + new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
  }

  // ---------- rendering ----------
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeJs(str) {
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
  function formatRelativeDate(pubDateStr) {
    if (!pubDateStr) return '';
    const d = new Date(pubDateStr);
    if (isNaN(d.getTime())) return '';
    const diffMs = Date.now() - d.getTime();
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    if (diffHours < 1) return 'Baru sahaja';
    if (diffHours < 24) return diffHours + ' jam lalu';
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays < 7) return diffDays + ' hari lalu';
    return d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderResults() {
    const root = $('resultsRoot');
    if (keywords.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <div class="title">Belum ada kata kunci dipantau</div>
          <div class="sub">Tambah kata kunci di atas — contoh nama pasukan bola, isu semasa,<br>atau apa-apa topik yang anda nak ikuti beritanya.</div>
        </div>
      `;
      return;
    }

    // Check overall loading/error state across all keywords first.
    const anyLoading = keywords.some(kw => !resultsByKeyword[kw] || resultsByKeyword[kw].loading);
    const allErrored = keywords.length > 0 && keywords.every(kw => resultsByKeyword[kw] && resultsByKeyword[kw].error);

    if (anyLoading && keywords.every(kw => !resultsByKeyword[kw] || (resultsByKeyword[kw].loading && (resultsByKeyword[kw].articles || []).length === 0))) {
      root.innerHTML = '<div class="loading-inline"><div class="spinner-sm"></div> Mencari berita untuk semua kata kunci...</div>';
      return;
    }

    // Merge every keyword's articles into one flat timeline, tagging each with its source keyword.
    let merged = [];
    keywords.forEach(kw => {
      const state = resultsByKeyword[kw];
      if (state && state.articles) {
        state.articles.forEach(a => merged.push(Object.assign({}, a, { _keyword: kw })));
      }
    });

    // De-duplicate the same article showing up under multiple keywords, keep the first occurrence.
    const seenLinks = new Set();
    merged = merged.filter(a => {
      if (seenLinks.has(a.link)) return false;
      seenLinks.add(a.link);
      return true;
    });

    // Sort newest first; articles without a parseable date sink to the bottom.
    merged.sort((a, b) => {
      const da = new Date(a.pubDate).getTime();
      const db = new Date(b.pubDate).getTime();
      const va = isNaN(da) ? 0 : da;
      const vb = isNaN(db) ? 0 : db;
      return vb - va;
    });

    // Bila semua kata kunci error TAPI masih ada artikel lama tersimpan (dari muat naik
    // sebelum ini), papar artikel itu dengan amaran, bukan sorok terus di sebalik ralat kosong.
    if (allErrored) {
      const firstError = resultsByKeyword[keywords[0]].error;
      if (merged.length === 0) {
        root.innerHTML = `<div class="error-banner">⚠ ${escapeHtml(firstError)}</div>`;
        return;
      }
      root.innerHTML = `<div class="stale-banner">⚠ ${escapeHtml(firstError)} Berita di bawah mungkin tak segar.<button onclick="refreshAll()">Cuba lagi</button></div>` + renderTimelineHtml(merged);
      return;
    }

    if (merged.length === 0) {
      root.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="sub">Tiada berita dijumpai buat masa ini untuk kata kunci yang dipantau.</div></div>';
      return;
    }

    root.innerHTML = renderTimelineHtml(merged);
  }

  function renderTimelineHtml(merged) {
    let html = '<div class="timeline">';
    merged.forEach(a => {
      const initial = a.source ? a.source.trim().charAt(0).toUpperCase() : '📰';
      html += `
        <a class="feed-card" href="${a.link}" target="_blank" rel="noopener noreferrer">
          <div class="feed-avatar">${escapeHtml(initial)}</div>
          <div class="feed-card-body">
            <div class="feed-card-top">
              ${a.source ? `<span class="feed-source-name">${escapeHtml(a.source)}</span>` : ''}
              ${a.source && a.pubDate ? `<span class="feed-dot">&middot;</span>` : ''}
              ${a.pubDate ? `<span class="feed-time">${formatRelativeDate(a.pubDate)}</span>` : ''}
              <span class="feed-keyword-tag">${escapeHtml(a._keyword)}</span>
            </div>
            <div class="feed-title">${escapeHtml(a.title)}</div>
          </div>
        </a>
      `;
    });
    html += '</div>';
    return html;
  }

  function updateStatusRow() {
    const total = Object.values(resultsByKeyword).reduce((sum, s) => sum + (s.articles ? s.articles.length : 0), 0);
    $('articleCount').textContent = total;
    $('statusRow').style.display = keywords.length > 0 ? 'flex' : 'none';
  }

  // ---------- auth ----------
  let authMode = 'signin';

  function escapeHtmlLocal(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAuthScreen(errorMsg) {
    const configured = !!supabaseClient;
    let html = '<div class="auth-page"><div class="auth-card">';
    html += '<div class="auth-title">📰 NewsDotCom</div>';
    html += '<div class="auth-sub">Log masuk untuk simpan kata kunci merentas peranti</div>';
    if (!configured && supabaseLoadError) {
      html += '<div class="auth-note">Tak dapat sambung ke perkhidmatan cloud \u2014 mungkin internet terputus. Boleh guna app di peranti ini sahaja buat sementara.</div>';
    }
    if (errorMsg) html += '<div class="auth-error">' + escapeHtmlLocal(errorMsg) + '</div>';
    html += '<div class="auth-field"><label>Emel</label><input type="email" id="authEmail" placeholder="anda@emel.com" autocomplete="email"></div>';
    html += '<div class="auth-field"><label>Kata laluan</label><input type="password" id="authPassword" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="' + (authMode === 'signup' ? 'new-password' : 'current-password') + '"></div>';
    html += '<button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()" ' + (configured ? '' : 'disabled') + '>' + (authMode === 'signup' ? 'Daftar' : 'Log Masuk') + '</button>';
    html += '<div class="auth-switch">';
    if (authMode === 'signup') html += 'Dah ada akaun? <button onclick="switchAuthMode(\'signin\')">Log masuk</button>';
    else html += 'Belum ada akaun? <button onclick="switchAuthMode(\'signup\')">Daftar</button>';
    html += '</div>';
    html += '<div class="auth-skip"><button onclick="skipAuth()">Guna tanpa log masuk</button></div>';
    html += '</div></div>';
    $('authRoot').innerHTML = html;
  }

  function switchAuthMode(mode) { authMode = mode; renderAuthScreen(); }

  function skipAuth() {
    $('authRoot').innerHTML = '';
    $('authRoot').style.display = 'none';
    $('mainPage').style.display = '';
    startApp();
  }

  async function handleAuthSubmit() {
    const email = ($('authEmail').value || '').trim();
    const password = $('authPassword').value || '';
    if (!email || !password) { renderAuthScreen('Sila isi emel dan kata laluan.'); return; }
    const btn = $('authSubmitBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sila tunggu\u2026'; }
    try {
      if (authMode === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          renderAuthScreen('Emel pengesahan telah dihantar. Sila semak emel anda, kemudian log masuk.');
          authMode = 'signin';
          return;
        }
        currentUser = data.user;
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
      }
      enterApp();
    } catch (err) {
      renderAuthScreen(err.message || 'Log masuk gagal. Sila cuba lagi.');
    }
  }

  function enterApp() {
    $('authRoot').innerHTML = '';
    $('authRoot').style.display = 'none';
    $('mainPage').style.display = '';
    startApp();
  }

  function handleLogout() {
    if (supabaseClient && currentUser) supabaseClient.auth.signOut();
    currentUser = null;
    keywords = [];
    resultsByKeyword = {};
    $('mainPage').style.display = 'none';
    $('authRoot').style.display = '';
    authMode = 'signin';
    renderAuthScreen();
  }

  async function initAuth() {
    if (!supabaseClient) {
      skipAuth();
      return;
    }
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user) {
      currentUser = data.session.user;
      enterApp();
    } else {
      renderAuthScreen();
    }
  }

  // ---------- app start (after auth resolved) ----------
  async function loadThemeCloud() {
    if (!currentUser || !supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('newsdotcom_settings').select('*').eq('user_id', currentUser.id).maybeSingle();
      if (!error && data) {
        currentColorTheme = data.color_theme || currentColorTheme;
        currentDarkMode = !!data.dark_mode;
        currentFont = data.font_choice || currentFont;
        applyThemeToDOM();
        applyFontToDOM();
        persistThemeLocal();
        persistFontLocal();
      }
    } catch (e) { console.error('Gagal muat tema dari cloud', e); }
  }

  async function startApp() {
    await loadThemeCloud();
    await loadKeywords();
    renderKeywordChips();
    renderResults();
    if (keywords.length > 0) {
      refreshAll();
    }
  }

  initAuth();
</script>

</body>
</html>
